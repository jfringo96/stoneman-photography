<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#1c1c1c"/>
  <!-- Outer lens ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#c4a882" stroke-width="2"/>
  <!-- Inner aperture ring -->
  <circle cx="16" cy="16" r="5" fill="none" stroke="#c4a882" stroke-width="1.5"/>
  <!-- Six aperture blades -->
  <line x1="16" y1="4" x2="16" y2="11" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26.4" y1="10" x2="20.3" y2="13.5" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26.4" y1="22" x2="20.3" y2="18.5" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="21" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5.6" y1="22" x2="11.7" y2="18.5" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5.6" y1="10" x2="11.7" y2="13.5" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round"/>
</svg>
