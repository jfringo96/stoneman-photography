<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css?v=7">

    <!-- Favicon -->

    <link rel="apple-touch-icon" href="/favicon-512.png">

    <!-- Open Graph -->
    <meta property="og:title" content="Project | Stoneman Photography">
    <meta property="og:description" content="A photography project by Stoneman Photography.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://stonemanphotography.co.uk/projects.html">

    <!-- Title and canonical are rewritten by script.js to match the project in ?p= -->
    <link rel="canonical" href="https://stonemanphotography.co.uk/projects.html">
</head>
<body class="dark-page">

    <!-- ======== NAVIGATION ======== -->

                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>


    <!-- Renders whichever project the ?p= slug names, including drafts when the URL
         also has preview=1. Published projects get their own generated page at
         /project/<slug>/ which renders through this same code. -->
    <main class="project-detail">
        <!-- Populated from content.json -->
    </main>


    <!-- ======== FOOTER ======== -->
    <footer>

        <p><a href="copyright.html">Copyright &amp; Image Use</a></p>
