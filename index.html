<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stoneman Photography - Capturing the beauty of wildlife and nature. Portfolio of wildlife, bird, and nature photography.">
    <meta name="google-site-verification" content="HrV4YCfxl-lROuz9-ihfWf_hU8eIRym4JJvHoDumXnA" />
    <title>Stoneman Photography - Wildlife &amp; Nature</title>

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Open Graph -->
    <meta property="og:title" content="Stoneman Photography - Wildlife &amp; Nature">
    <meta property="og:description" content="Capturing the beauty of wildlife and nature. Portfolio of wildlife, bird, and nature photography.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stonemanphotography.co.uk/">
</head>
<body class="home-page">

    <!-- ======== NAVIGATION (shared across all pages) ======== -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">Stoneman Photography</a>

            <!-- Hamburger button (visible on mobile only) -->
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>

            <!-- Navigation links -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>


    <!-- ✏️ EDIT: Hero section — change your headline, tagline, or call-to-action below -->
    <section class="hero">
        <!-- Dark overlay for text readability -->
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Stoneman Photography</h1>
            <p>Wildlife &amp; Nature</p>
            <a href="portfolio.html" class="cta-button">View Portfolio</a>
        </div>
    </section>


    <!-- ✏️ EDIT: Featured images — change the three showcase images below -->
    <section class="featured-section">
        <div class="featured-grid">
            <!-- Featured images populated from content.json by script.js -->
        </div>
    </section>


    <!-- ======== LIGHTBOX (Full-Screen Image Viewer) ======== -->
    <!-- Hidden by default. JavaScript shows it when a gallery/featured item is clicked. -->
    <div class="lightbox" role="dialog" aria-label="Image viewer">
        <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
        <button class="lightbox-prev" aria-label="Previous image">&#8249;</button>
        <button class="lightbox-next" aria-label="Next image">&#8250;</button>
        <div class="lightbox-content">
            <span>Photo</span>
        </div>
    </div>


    <!-- ======== FOOTER (shared across all pages) ======== -->
    <footer>
        <p>&copy; 2026 Stoneman Photography. All rights reserved.</p>
        <p><a href="copyright.html">Copyright &amp; Image Use</a></p>
    </footer>


    <!-- Shared JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
